[project]
name = "project-euler"
version = "0.1.0"
description = "Project Euler Solutions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numba>=0.68.0",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "ipython>=9.17.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "scalene>=2.3.0",
    "ty>=0.0.84",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"
